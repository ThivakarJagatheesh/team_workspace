name: team_workspace
description: Team Workspace Flutter Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5

  # Dependency Injection
  get_it: ^7.7.0

  # Networking
  dio: ^5.7.0

  # Functional Programming
  dartz: ^0.10.1

  # Equality
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Connectivity
  connectivity_plus: ^6.0.5

  # Navigation
  go_router: ^14.2.7

  # Others
  intl: ^0.19.0
  flutter_dotenv: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - .env.example