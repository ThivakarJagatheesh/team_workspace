name: Build and distribute Production APK

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_DISTRIBUTION_GROUP: ${{ secrets.FIREBASE_DISTRIBUTION_GROUP }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          cat > .env <<EOF
          DEV_BASE_URL=${{ secrets.DEV_BASE_URL }}
          PROD_BASE_URL=${{ secrets.PROD_BASE_URL }}
          TASKS_ENDPOINT=${{ secrets.TASKS_ENDPOINT }}
          EOF

      - name: Restore google-services.json
        run: |
          mkdir -p android/app/src/dev
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/src/dev/google-services.json

      - name: Build Production Release APK
        run: flutter build apk --release --flavor prod -t lib/main_prod.dart

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_DISTRIBUTION_GROUP }}
          file: build/app/outputs/flutter-apk/app-prod-release.apk